
name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cai dat Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Dang nhap Postman
        run: postman login --with-api-key "${{ secrets.POSTMAN_API_KEY }}"

      - name: Chay Monitor
        run: |
          postman collection run "58312210-e0e0960b-b20f-4738-ac2d-f6955e84cf11"
